<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolidFlo — Offline</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #1a2332;
        border: 1px solid #253347;
        border-radius: 20px;
        padding: 48px 40px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        background: #253347;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #f1f5f9;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #1d4ed8;
      }
      .tip {
        margin-top: 24px;
        padding: 16px;
        background: #253347;
        border-radius: 10px;
        font-size: 12px;
        color: #64748b;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg
          width="32"
          height="32"
          fill="none"
          stroke="#64748b"
          stroke-width="1.5"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"
          />
          <circle cx="12" cy="12" r="9" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        SolidFlo needs an internet connection to sync your data. Check your
        connection and try again.
      </p>
      <a class="btn" onclick="location.reload()">
        <svg
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          />
        </svg>
        Try again
      </a>
      <div class="tip">
        Tip: Previously viewed invoices and client data may still be available
        if you opened them while online.
      </div>
    </div>
  </body>
</html>
